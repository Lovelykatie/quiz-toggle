<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-white text-black min-h-screen flex flex-col items-center justify-center transition-colors duration-300" id="page">

    <button id="theme-toggle" class="fixed top-4 right-4 px-4 py-2 bg-gray-800 text-white rounded">Toggle</button>

        <h1 class="text-black font-bold text-xl mb-10">SIMPLE QUIZ</h1>

    <div class="w-full max-w-md p-6 bg-gray-300 dark:bg-gray-800 dark:text-white rounded-lg shadow-md" id="quiz-container">
        <h2 class="text-2xl font-bold mb-4 dark:text-white" id="question"></h2>
        <div class="mb-4 space-y-2" id="answers"></div>
        <button class="bg-gray-700 text-white px-4 py-2 rounded" id="next-btn">Next</button>
        <div class="mt-4 font-semi-bold" id="score" style="display: none;"></div>
        <button id="back-btn" class="mt-4 px-4 py-2 bg-gray-700 text-white rounded" style="display: none;">Back</button>

    </div>

    <script src="script.js"></script>
    
</body>
</html>
